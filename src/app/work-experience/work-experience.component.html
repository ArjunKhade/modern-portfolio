<section class="portfolio-section" id="experience">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <div class="section-tag">
        <i class="bx bx-briefcase"></i>
        <span>Career Journey</span>
      </div>
      <h2 class="section-title">
        Work <span class="gradient-text">Experience</span>
      </h2>
      <p class="section-subtitle">
        Delivering business results and engineering excellence across fast-paced production software environments.
      </p>
    </div>

    <!-- Timeline Wrapper -->
    <div class="timeline-wrapper">
      <div
        class="timeline-item"
        *ngFor="let item of workExpList"
      >
        <!-- Timeline Marker Node -->
        <div class="timeline-marker">
          <div class="marker-dot"></div>
          <div class="marker-pulse"></div>
        </div>

        <!-- Experience Content Card -->
        <div class="experience-card glass-card">
          <div class="experience-header">
            <div>
              <span class="company-badge font-mono">
                <i class="bx bx-buildings"></i> {{ item.company }}
              </span>
              <h3 class="role-title">{{ item.role }}</h3>
            </div>
            <div class="duration-pill font-mono">
              <i class="bx bx-calendar"></i>
              <span>{{ item.duration }}</span>
            </div>
          </div>

          <!-- Metrics Badges -->
          <div class="metrics-row" *ngIf="item.metrics">
            <span class="metric-pill" *ngFor="let metric of item.metrics">
              <i class="bx bx-trending-up"></i> {{ metric }}
            </span>
          </div>

          <!-- Description Bullet List -->
          <ul class="experience-bullets">
            <li *ngFor="let desc of item.description">
              <i class="bx bx-chevron-right bullet-icon"></i>
              <span>{{ desc }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
