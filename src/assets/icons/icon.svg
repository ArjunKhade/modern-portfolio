<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#162238" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f5a0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Main Letter A Gradient (Left Stem) -->
    <linearGradient id="leftStemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>

    <!-- Main Letter A Gradient (Right Stem) -->
    <linearGradient id="rightStemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Crossbar Gradient -->
    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00f5a0" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f5a0" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Smooth Rounded Squircle Container (No sharp corners) -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="120"
    ry="120"
    fill="url(#bgGlow)"
    stroke="url(#borderGrad)"
    stroke-width="4"
  />

  <!-- Subtle Inner Ring Accent -->
  <rect
    x="34"
    y="34"
    width="444"
    height="444"
    rx="110"
    ry="110"
    fill="none"
    stroke="rgba(255, 255, 255, 0.04)"
    stroke-width="1.5"
  />

  <!-- Letter 'A' Ambient Glow Group -->
  <g filter="url(#neonGlow)" opacity="0.65">
    <!-- Left Leg -->
    <path
      d="M 148 384 L 256 128"
      stroke="url(#leftStemGrad)"
      stroke-width="44"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Right Leg -->
    <path
      d="M 256 128 L 364 384"
      stroke="url(#rightStemGrad)"
      stroke-width="44"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Crossbar -->
    <path
      d="M 194 286 L 318 286"
      stroke="url(#crossbarGrad)"
      stroke-width="38"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Crisp Core Letter 'A' (Smooth Rounded Vertices, No Sharp Corners) -->
  <g filter="url(#softShadow)">
    <!-- Left Leg: Rounded base up to rounded apex -->
    <path
      d="M 148 384 L 256 128"
      stroke="url(#leftStemGrad)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Right Leg: Rounded apex down to rounded base -->
    <path
      d="M 256 128 L 364 384"
      stroke="url(#rightStemGrad)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Smooth Horizontal Crossbar with Rounded Ends -->
    <path
      d="M 194 286 L 318 286"
      stroke="url(#crossbarGrad)"
      stroke-width="38"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Apex Node Glow Highlight -->
    <circle cx="256" cy="128" r="14" fill="#ffffff" opacity="0.85" />
    <circle cx="256" cy="128" r="22" fill="#00f5a0" opacity="0.4" />
  </g>
</svg>
